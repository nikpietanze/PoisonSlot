<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#1c2a17"/>
      <stop offset="0.6" stop-color="#0e150c"/>
      <stop offset="1" stop-color="#060806"/>
    </radialGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8b27a"/>
      <stop offset="0.35" stop-color="#9a7444"/>
      <stop offset="0.65" stop-color="#c49a5e"/>
      <stop offset="1" stop-color="#5a4022"/>
    </linearGradient>
    <linearGradient id="bronzeIn" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3a2a16"/>
      <stop offset="1" stop-color="#1a130a"/>
    </linearGradient>
    <radialGradient id="glow" cx="40%" cy="85%" r="60%">
      <stop offset="0" stop-color="#7dff52" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#3fbf2a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2a8a1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steelL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7d0d6"/>
      <stop offset="1" stop-color="#f4f7f9"/>
    </linearGradient>
    <linearGradient id="steelR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7d8890"/>
      <stop offset="1" stop-color="#4a545b"/>
    </linearGradient>
    <linearGradient id="poison" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3fbf2a"/>
      <stop offset="1" stop-color="#9dff5e"/>
    </linearGradient>
    <radialGradient id="dropG" cx="38%" cy="60%" r="65%">
      <stop offset="0" stop-color="#b8ff7a"/>
      <stop offset="0.6" stop-color="#5fd93a"/>
      <stop offset="1" stop-color="#2a8f1c"/>
    </radialGradient>
    <radialGradient id="poolG" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#b8ff7a"/>
      <stop offset="0.5" stop-color="#5fd93a"/>
      <stop offset="1" stop-color="#1f7a16"/>
    </radialGradient>
    <clipPath id="inner">
      <rect x="32" y="32" width="448" height="448" rx="52"/>
    </clipPath>
    <linearGradient id="poolV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe84c"/>
      <stop offset="0.35" stop-color="#3fae27"/>
      <stop offset="1" stop-color="#14450c"/>
    </linearGradient>
    <clipPath id="poolClip">
      <path d="M20 414 C70 404 110 420 150 414 C200 406 240 422 290 414 C340 406 380 420 420 412 C450 407 470 410 500 414 L500 500 L20 500 Z"/>
    </clipPath>
    <clipPath id="bladeClip">
      <path d="M0 0 L26 -78 L19 -258 L-19 -258 L-26 -78 Z"/>
    </clipPath>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a2f18"/>
      <stop offset="0.45" stop-color="#2a180b"/>
      <stop offset="1" stop-color="#140b04"/>
    </linearGradient>
    <radialGradient id="gem" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e6ffcc"/>
      <stop offset="0.4" stop-color="#6ee842"/>
      <stop offset="1" stop-color="#14450c"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="72" fill="url(#bronze)"/>
  <rect x="24" y="24" width="464" height="464" rx="58" fill="url(#bronzeIn)"/>
  <rect x="32" y="32" width="448" height="448" rx="52" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="52" fill="url(#glow)"/>

  <g transform="translate(150 322) rotate(45) scale(0.9)">
    <!-- blade -->
    <path d="M0 0 L-26 -78 L-19 -258 L0 -258 Z" fill="url(#steelL)"/>
    <path d="M0 0 L26 -78 L19 -258 L0 -258 Z" fill="url(#steelR)"/>
    <path d="M0 0 L-26 -78 L-19 -258 L-12 -258 L-18 -80 L0 -22 Z" fill="#ffffff" fill-opacity="0.75"/>
    <path d="M0 0 L26 -78 L19 -258 L12 -258 L18 -80 L0 -22 Z" fill="#2a3136" fill-opacity="0.6"/>
    <path d="M-3 -96 L-3 -246 L3 -246 L3 -96 Z" fill="#3a444b"/>
    <path d="M-3 -96 L-3 -246" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
    <g clip-path="url(#bladeClip)">
      <path d="M-40 -150 C-30 -158 -26 -114 -16 -116 C-8 -118 -10 -164 0 -162 C10 -160 8 -128 16 -130 C24 -132 26 -156 40 -152 L40 10 L-40 10 Z" fill="url(#poison)" fill-opacity="0.95"/>
      <path d="M-18 -80 L0 -22 L-26 -78 Z" fill="#e6ffcc" fill-opacity="0.35"/>
      <path d="M-13 -56 C-14 -86 -13 -100 -11 -108" stroke="#e6ffcc" stroke-opacity="0.75" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>
    <path d="M0 0 L26 -78 L19 -258 L-19 -258 L-26 -78 Z" fill="none" stroke="#11161a" stroke-width="7" stroke-linejoin="round"/>
    <!-- swept crossguard with a gem -->
    <path d="M0 -292 L22 -282 C48 -284 72 -270 88 -234 C68 -254 44 -262 22 -256 L0 -248 L-22 -256 C-44 -262 -68 -254 -88 -234 C-72 -270 -48 -284 -22 -282 Z" fill="url(#bronze)" stroke="#24180b" stroke-width="6" stroke-linejoin="round"/>
    <path d="M0 -298 L20 -270 L0 -242 L-20 -270 Z" fill="url(#bronze)" stroke="#24180b" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="0" cy="-270" r="8" fill="url(#gem)" stroke="#0e2e08" stroke-width="3"/>
    <!-- wrapped grip -->
    <path d="M-12 -296 L12 -296 L15 -360 L-15 -360 Z" fill="url(#leather)" stroke="#120a04" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-13 -306 L14 -316 M-14 -322 L14 -332 M-14 -338 L15 -348" stroke="#8a6038" stroke-width="5" stroke-linecap="round"/>
    <rect x="-18" y="-304" width="36" height="10" rx="4" fill="url(#bronze)" stroke="#24180b" stroke-width="4"/>
    <rect x="-20" y="-366" width="40" height="10" rx="4" fill="url(#bronze)" stroke="#24180b" stroke-width="4"/>
    <!-- faceted pommel with a gem -->
    <path d="M0 -404 L18 -382 L0 -364 L-18 -382 Z" fill="url(#bronze)" stroke="#24180b" stroke-width="5" stroke-linejoin="round"/>
    <path d="M0 -404 L0 -364 M-18 -382 L18 -382" stroke="#24180b" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="0" cy="-382" r="6" fill="url(#gem)" stroke="#0e2e08" stroke-width="2.5"/>
    <!-- glint -->
    <path d="M-15 -232 L-12 -222 L-2 -219 L-12 -216 L-15 -206 L-18 -216 L-28 -219 L-18 -222 Z" fill="#ffffff"/>
  </g>

  <!-- pool filling the bottom -->
  <g clip-path="url(#inner)">
    <path d="M20 414 C70 404 110 420 150 414 C200 406 240 422 290 414 C340 406 380 420 420 412 C450 407 470 410 500 414 L500 500 L20 500 Z" fill="url(#poolV)"/>
    <path d="M20 414 C70 404 110 420 150 414 C200 406 240 422 290 414 C340 406 380 420 420 412 C450 407 470 410 500 414" fill="none" stroke="#c8ff94" stroke-width="5"/>
    <g clip-path="url(#poolClip)">
    <ellipse cx="150" cy="424" rx="34" ry="7" fill="none" stroke="#e6ffcc" stroke-opacity="0.8" stroke-width="3.5"/>
    <ellipse cx="150" cy="426" rx="68" ry="14" fill="none" stroke="#e6ffcc" stroke-opacity="0.4" stroke-width="3"/>
    <ellipse cx="150" cy="428" rx="108" ry="22" fill="none" stroke="#e6ffcc" stroke-opacity="0.18" stroke-width="3"/>
    </g>
    <ellipse cx="330" cy="446" rx="9" ry="4" fill="#c8ff94" fill-opacity="0.5"/>
    <circle cx="370" cy="458" r="5" fill="#c8ff94" fill-opacity="0.45"/>
    <circle cx="260" cy="462" r="7" fill="#c8ff94" fill-opacity="0.35"/>
    <circle cx="410" cy="440" r="4" fill="#c8ff94" fill-opacity="0.5"/>
    <circle cx="80" cy="452" r="5" fill="#c8ff94" fill-opacity="0.4"/>
  </g>
  <!-- splash -->
  <path d="M130 418 C126 410 127 404 131 400" fill="none" stroke="#9dff5e" stroke-width="5" stroke-linecap="round"/>
  <path d="M170 418 C174 410 173 404 169 400" fill="none" stroke="#9dff5e" stroke-width="5" stroke-linecap="round"/>
  <circle cx="122" cy="394" r="4.5" fill="#9dff5e" stroke="#164d0e" stroke-width="2.5"/>
  <circle cx="178" cy="394" r="4.5" fill="#9dff5e" stroke="#164d0e" stroke-width="2.5"/>
  <!-- drip at the tip and a falling drop -->
  <path d="M150 316 C154 330 162 340 162 350 C162 358 157 363 150 363 C143 363 138 358 138 350 C138 340 146 330 150 316 Z" fill="url(#dropG)" stroke="#164d0e" stroke-width="4.5"/>
  <path d="M150 362 C150 362 162 378 162 386 C162 393 157 398 150 398 C143 398 138 393 138 386 C138 378 150 362 150 362 Z" fill="url(#dropG)" stroke="#164d0e" stroke-width="4"/>
  <ellipse cx="145" cy="347" rx="3.5" ry="6" fill="#fff" fill-opacity="0.6"/>
  <ellipse cx="145" cy="384" rx="3" ry="5" fill="#fff" fill-opacity="0.6"/>
</svg>
